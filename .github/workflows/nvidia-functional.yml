name: NVIDIA functional model tests

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Maximum concurrent model tests (1-3)"
        required: true
        default: "3"
        type: string
      models:
        description: "Optional comma-separated model IDs; empty means all active models"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: nvidia-functional-${{ github.repository }}
  cancel-in-progress: false

jobs:
  functional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run functional NVIDIA tests
        env:
          NVIDIA_API_KEYS_JSON: ${{ secrets.NVIDIA_API_KEYS_JSON }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_FUNCTIONAL_WORKERS: ${{ inputs.workers }}
          NVIDIA_FUNCTIONAL_MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEYS_JSON}${NVIDIA_API_KEY}"
          mkdir -p artifacts
          PYTHONPATH=src python scripts/nvidia_functional_smoke.py > artifacts/nvidia-functional.json
          grep -q '"status": "completed"' artifacts/nvidia-functional.json

      - name: Upload redacted functional report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-functional-${{ github.run_id }}
          path: artifacts/nvidia-functional.json
          retention-days: 14
