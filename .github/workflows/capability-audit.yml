name: Full model capability audit

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Maximum concurrent live probes (1-3)"
        required: true
        default: "3"
        type: string
      models:
        description: "Optional comma-separated provider/model IDs; empty means all"
        required: false
        default: ""
        type: string
      raw_fallback:
        description: "Retry JSON failures as raw text when adapter supports it"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: capability-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run capability audit
        env:
          AI_ROUTER_GEMINI_KEYS_JSON: ${{ secrets.AI_ROUTER_GEMINI_KEYS_JSON }}
          AI_ROUTER_HF_KEYS_JSON: ${{ secrets.AI_ROUTER_HF_KEYS_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_ROUTER_OPENROUTER_KEYS_JSON: ${{ secrets.AI_ROUTER_OPENROUTER_KEYS_JSON }}
          OPENROUTER_API_KEYS_JSON: ${{ secrets.OPENROUTER_API_KEYS_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEYS_JSON: ${{ secrets.NVIDIA_API_KEYS_JSON }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CAPABILITY_AUDIT_WORKERS: ${{ inputs.workers }}
          CAPABILITY_AUDIT_MODELS: ${{ inputs.models }}
          CAPABILITY_AUDIT_RAW_FALLBACK: ${{ inputs.raw_fallback }}
          CAPABILITY_AUDIT_STATE_DB: /tmp/capability-audit.db
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=src python scripts/capability_audit.py > artifacts/capability-audit.json
          grep -q '"status": "completed"' artifacts/capability-audit.json

      - name: Upload redacted audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-audit-${{ github.run_id }}
          path: artifacts/capability-audit.json
          retention-days: 14
