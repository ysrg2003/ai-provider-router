name: Autonomous curiosity script through prepared free router
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curiosity-prepared-router
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35887a2f864016fa577991f9ef8e559a6a91d996
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ysrg2003/curiosity-shorts-studio
          ref: 4dcf344783ee9910f4e41ec801e1adbf092dbe4b
          path: studio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prepared router and pinned studio
        run: |
          python -m pip install -e .
          python -m pip install -e './studio[test,research]'
      - name: Validate implementation before account access
        working-directory: studio
        run: python -m pytest -q
      - name: Automatic question research and script, exact free router only
        env:
          CURIOSITY_LLM_BACKEND: prepared-router
          CURIOSITY_DISCOVERY: prepared-router-grounded
          CURIOSITY_GEMINI_FREE_TIER_VERIFIED: '1'
          OMP_NUM_THREADS: '2'
        run: |
          export CURIOSITY_ROUTER_CONFIG="$GITHUB_WORKSPACE/config"
          cd studio
          echo 'OpenRouter is stopped after confirmed HTTP429 quota in run45110330380. No inference, retry, or alternate credentials.'
          exit 1
      - name: Preserve script evidence diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-curiosity-router-preflight
          path: studio/drafts/*.json
          retention-days: 1
          if-no-files-found: warn
