name: Temporary deploy chatgpt-api Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout router
        uses: actions/checkout@v4

      - name: Deploy main.py to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          git clone --depth 1 https://github.com/ysrg2003/chatgpt-api.git source
          AUTH=$(printf 'hf-deploy:%s' "$HF_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $AUTH" clone https://huggingface.co/spaces/Yousefsg/chatgpt-api.git space
          cp source/main.py space/main.py
          cd space
          git config user.name "ai-provider-router deploy"
          git config user.email "actions@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "Space already contains the requested main.py"
            exit 0
          fi
          git commit -m "deploy chatgpt-api main.py"
          git -c "http.extraheader=Authorization: Basic $AUTH" push origin HEAD:main

      - name: Restart Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: Yousefsg/chatgpt-api
          SPACE_DEPLOY_REV: ${{ github.sha }}
        run: |
          python -m pip install --quiet huggingface_hub
          python scripts/restart_hf_space.py
