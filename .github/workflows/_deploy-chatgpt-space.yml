name: Temporary deploy chatgpt-api Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout router
        uses: actions/checkout@v4

      - name: Deploy attached ZIP project to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          git clone --depth 1 https://github.com/ysrg2003/chatgpt-api.git source
          AUTH=$(printf 'hf-deploy:%s' "$HF_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $AUTH" clone https://huggingface.co/spaces/Yousefsg/chatgpt-api.git space
          find space -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/* space/
          cd space
          git config user.name "ai-provider-router deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Space already contains the attached ZIP project"
            exit 0
          fi
          git commit -m "reset: deploy attached ZIP project only"
          git -c "http.extraheader=Authorization: Basic $AUTH" push origin HEAD:main
