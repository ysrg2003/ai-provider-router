name: One bounded Gemini structural response diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35887a2f864016fa577991f9ef8e559a6a91d996
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ysrg2003/curiosity-shorts-studio
          ref: ef68aad73840828c5b0c49b6763e2019731f1ffe
          path: studio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m pip install -e ./studio
      - name: One same-key same-model call, structural result only
        env:
          AI_ROUTER_GEMINI_KEYS_JSON: ${{ secrets.AI_ROUTER_GEMINI_KEYS_JSON }}
          CURIOSITY_LLM_BACKEND: prepared-router-gemini
          CURIOSITY_GEMINI_FREE_TIER_VERIFIED: '1'
          CURIOSITY_OPENROUTER_STOPPED: '1'
        run: |
          export CURIOSITY_ROUTER_CONFIG="$GITHUB_WORKSPACE/config"
          python - <<'PY'
          import datetime,json,time
          from pathlib import Path
          from curiosity.router_ai import engine
          if datetime.datetime.now(datetime.timezone.utc).date()>=datetime.date(2026,12,1):raise SystemExit('Reverify migration pricing')
          report={'diagnostic_only':True,'production_restart':False,'previous_gemini_failure_run':45111351142,'openrouter_stopped_run':45110330380,'provider':'google_gemini','model':'gemini-2.5-flash','max_attempts':1,'key_rotation':False,'fallback':False,'free_tier_verified':True}
          router,_=engine();started=time.monotonic()
          try:
              result=router.complete_auto(output_type='text',grounding='search',provider='google_gemini',model='gemini-2.5-flash',operation='bounded_structural_diagnostic',system_prompt='Use actual Google Search grounding. Return official documentation sources only.',user_prompt='Find the official Gemini API page documenting Google Search grounding. This is a connectivity diagnostic, not production research.')
              metadata=result.get('grounding_metadata') or {}
              report.update(success=True,grounding_verified=bool(metadata.get('webSearchQueries')) and bool(metadata.get('groundingChunks')))
          except Exception as error:
              report.update(success=False,failure_type=type(error).__name__,provider_failures=router._curiosity_failures)
          report.update(response_shape=router._curiosity_response_shape,seconds=round(time.monotonic()-started,2))
          Path('structural-result.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-structural-diagnostic
          path: structural-result.json
          retention-days: 1
