[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-provider-router"
version = "0.1.0"
description = "Config-driven multi-provider JSON AI router with ordered key rotation and SQLite state"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
ai-router = "ai_router.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
